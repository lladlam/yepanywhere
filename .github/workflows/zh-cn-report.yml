name: Generate zh-CN i18n report

on:
  push:
    branches:
      - i18n/complete-zh-cn
    paths-ignore:
      - i18n-missing-zh-CN.json
      - i18n-missing-zh-CN.md

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: i18n/complete-zh-cn
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate reports
        run: |
          node scripts/report-i18n-missing.mjs --locale zh-CN --json > i18n-missing-zh-CN.json
          node scripts/report-i18n-missing.mjs --locale zh-CN --markdown --limit all > i18n-missing-zh-CN.md
      - name: Commit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add i18n-missing-zh-CN.json i18n-missing-zh-CN.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: generate zh-CN i18n report"
          git push origin HEAD:i18n/complete-zh-cn
