name: Validate complete zh-CN catalog

on:
  push:
    branches:
      - i18n/complete-zh-cn
    paths-ignore:
      - zh-CN-validation-result.txt

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: i18n/complete-zh-cn
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        id: install
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee /tmp/install.log
      - name: Validate catalog coverage and placeholders
        id: catalog
        continue-on-error: true
        run: |
          set -o pipefail
          node --input-type=module <<'NODE' 2>&1 | tee /tmp/catalog.log
          import { readFile, readdir } from "node:fs/promises";
          import path from "node:path";

          const i18nDir = "packages/client/src/i18n";
          const readJson = async (p) => JSON.parse(await readFile(p, "utf8"));
          const en = await readJson(path.join(i18nDir, "en.json"));
          const base = await readJson(path.join(i18nDir, "zh-CN.json"));
          const fragmentDir = path.join(i18nDir, "zh-CN-complete");
          const fragmentFiles = (await readdir(fragmentDir))
            .filter((name) => name.endsWith(".json"))
            .sort();
          const merged = {};
          for (const file of fragmentFiles) {
            Object.assign(merged, await readJson(path.join(fragmentDir, file)));
          }
          Object.assign(merged, base);

          const enKeys = Object.keys(en);
          const missing = enKeys.filter((key) => !Object.hasOwn(merged, key));
          const extra = Object.keys(merged).filter((key) => !Object.hasOwn(en, key));
          const placeholders = (value) =>
            [...String(value).matchAll(/\{([A-Za-z0-9_]+)\}/g)]
              .map((match) => match[1])
              .sort();
          const placeholderMismatches = enKeys.filter(
            (key) =>
              JSON.stringify(placeholders(en[key])) !==
              JSON.stringify(placeholders(merged[key])),
          );

          console.log(`English keys: ${enKeys.length}`);
          console.log(`Fallback fragments: ${fragmentFiles.length}`);
          console.log(`Missing keys: ${missing.length}`);
          console.log(`Extra keys: ${extra.length}`);
          console.log(`Placeholder mismatches: ${placeholderMismatches.length}`);
          if (missing.length) console.log("Missing:", missing);
          if (extra.length) console.log("Extra:", extra);
          if (placeholderMismatches.length) {
            console.log("Placeholder mismatches:", placeholderMismatches);
          }
          if (missing.length || extra.length || placeholderMismatches.length) {
            process.exit(1);
          }
          NODE
      - name: Typecheck
        id: typecheck
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm typecheck 2>&1 | tee /tmp/typecheck.log
      - name: Build client
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm --filter client build 2>&1 | tee /tmp/build.log
      - name: Record diagnostics
        if: always()
        run: |
          {
            echo 'zh-CN validation diagnostics'
            echo "Install: ${{ steps.install.outcome }}"
            echo "Catalog: ${{ steps.catalog.outcome }}"
            echo "TypeScript typecheck: ${{ steps.typecheck.outcome }}"
            echo "Client build: ${{ steps.build.outcome }}"
            echo "Commit: $GITHUB_SHA"
            for log in catalog typecheck build install; do
              file="/tmp/$log.log"
              if [ -f "$file" ]; then
                echo
                echo "--- $log log ---"
                tail -n 120 "$file"
              fi
            done
          } > zh-CN-validation-result.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zh-CN-validation-result.txt
          git commit -m "chore: record zh-CN validation diagnostics"
          git push origin HEAD:i18n/complete-zh-cn
