name: Validate zh-CN pull request

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate catalog
        run: |
          node --input-type=module <<'NODE'
          import { readFile, readdir } from "node:fs/promises";
          import path from "node:path";
          const dir = "packages/client/src/i18n";
          const json = async (p) => JSON.parse(await readFile(p, "utf8"));
          const en = await json(path.join(dir, "en.json"));
          const base = await json(path.join(dir, "zh-CN.json"));
          const fragmentDir = path.join(dir, "zh-CN-complete");
          const files = (await readdir(fragmentDir)).filter((f) => f.endsWith(".json")).sort();
          const merged = {};
          for (const file of files) Object.assign(merged, await json(path.join(fragmentDir, file)));
          Object.assign(merged, base);
          const vars = (v) =>
            [...String(v).matchAll(/\{([A-Za-z0-9_]+)\}/g)]
              .map((m) => m[1])
              .filter((name) => name !== "suffix")
              .sort();
          const missing = Object.keys(en).filter((key) => !Object.hasOwn(merged, key));
          const extra = Object.keys(merged).filter((key) => !Object.hasOwn(en, key));
          const mismatched = Object.keys(en).filter((key) => JSON.stringify(vars(en[key])) !== JSON.stringify(vars(merged[key])));
          console.log({ englishKeys: Object.keys(en).length, fragments: files.length, missing, extra, mismatched });
          if (missing.length || extra.length || mismatched.length) process.exit(1);
          NODE
      - name: Typecheck
        run: pnpm typecheck
      - name: Build client
        run: pnpm --filter client build
